<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex box</title>
  </head>
  <body>
    <div
      style="
        display: flex;
        width: 900px;
        height: 450px;
        background-color: purple;
        align-content: flex-end;
        padding: 20px;
        padding-top: 100px;
      "
    >
      <div style="display: flex; flex-direction: column">
        <div
          style="
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 900px;
            height: 300px;
          "
        >
          <div
            style="
              width: 435px;
              height: 300px;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <div
              style="width: 435px; height: 60px; background-color: pink"
            ></div>
            <div
              style="
                display: flex;
                width: 435px;
                height: 240px;
                border: 1px solid black;
                flex-direction: row;
                gap: 20px;
              "
            >
              <div style="display: flex; flex-direction: column; gap: 10px">
                <div
                  style="
                    width: 207px;
                    height: 60%;
                    background-color: yellowgreen;
                  "
                ></div>
                <div
                  style="
                    width: 207px;
                    height: 40%;
                    background-color: blueviolet;
                  "
                ></div>
              </div>
              <div
                style="width: 207px; height: 240px; background-color: aqua"
              ></div>
            </div>
          </div>

          <div
            style="
              width: 435px;
              height: 300px;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <div
              style="
                display: flex;
                width: 435px;
                height: 240px;
                border: 1px solid black;
                flex-direction: row;
                gap: 20px;
              "
            >
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 10px;
                  width: 207px;
                  height: 240px;
                "
              >
                <div
                  style="width: 207px; height: 70px; background-color: red"
                ></div>
                <div
                  style="width: 207px; height: 50px; background-color: aqua"
                ></div>
                <div
                  style="width: 207px; height: 100px; background-color: yellow"
                ></div>
              </div>
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 10px;
                  width: 207px;
                  height: 240px;
                "
              >
                <div
                  style="width: 207px; height: 100px; background-color: yellow"
                ></div>
                <div
                  style="width: 207px; height: 70px; background-color: red"
                ></div>
                <div
                  style="width: 207px; height: 50px; background-color: aqua"
                ></div>
              </div>
            </div>
            <div
              style="width: 435px; height: 60px; background-color: pink"
            ></div>
          </div>
        </div>
        <div
          style="
            width: 900px;
            height: 150px;
            display: flex;

            align-items: center;
          "
        >
          <p
            style="
              font-size: 100px;
              width: 100%;
              margin: 0;
              color: white;
              text-align: center;
            "
          >
            CSS FLEXBOX
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
